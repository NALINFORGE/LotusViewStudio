name: Refactor single package version source

on:
  push:
    branches:
      - refactor/single-version-source-b4

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/single-version-source-b4

      - name: Refactor version architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          component = root / 'custom_components' / 'lotus_view_studio'
          frontend = component / 'frontend'
          manifest_path = component / 'manifest.json'
          new_version = '0.13.0b4'

          # 1. manifest.json becomes the only manually maintained package version.
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = new_version
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2. Remove duplicated Python package version constants.
          const_path = component / 'const.py'
          const = const_path.read_text(encoding='utf-8')
          const = re.sub(r'^VERSION = .*\n', '', const, flags=re.MULTILINE)
          const = re.sub(r'^MODULE_URL = .*\n', '', const, flags=re.MULTILINE)
          const_path.write_text(const, encoding='utf-8')

          # 3. Backend reads manifest.json and exposes versioned static URL roots.
          init_path = component / '__init__.py'
          init = init_path.read_text(encoding='utf-8')
          init = init.replace('from inspect import signature\n', 'from inspect import signature\nimport json\n')
          init = init.replace('    MODULE_URL,\n', '')
          init = init.replace(
              '_FRONTEND_DIR = Path(__file__).parent / "frontend"\n_BRAND_DIR = Path(__file__).parent / "brand"\n',
              '_COMPONENT_DIR = Path(__file__).parent\n_FRONTEND_DIR = _COMPONENT_DIR / "frontend"\n_BRAND_DIR = _COMPONENT_DIR / "brand"\n_MANIFEST_PATH = _COMPONENT_DIR / "manifest.json"\n\n\ndef _package_version() -> str:\n    """Return the integration version declared by manifest.json."""\n    manifest = json.loads(_MANIFEST_PATH.read_text(encoding="utf-8"))\n    version = str(manifest.get("version", "")).strip()\n    if not version:\n        raise ValueError("Lotus View Studio manifest.json does not declare a version")\n    return version\n'
          )
          init = init.replace(
              '    data = hass.data.setdefault(DOMAIN, {})\n',
              '    data = hass.data.setdefault(DOMAIN, {})\n    package_version = _package_version()\n    versioned_url_base = f"{URL_BASE}/{package_version}"\n    versioned_brand_url = f"{BRAND_URL}/{package_version}"\n    module_url = f"{versioned_url_base}/lotus-visual.js"\n'
          )
          old_static = '''            [\n                StaticPathConfig(URL_BASE, str(_FRONTEND_DIR), cache_headers=False),\n                StaticPathConfig(BRAND_URL, str(_BRAND_DIR), cache_headers=False),\n                # Compatibility aliases for browser caches / manually registered\n                # resources from Lotus Visual releases prior to 0.12.0.\n                StaticPathConfig(LEGACY_URL_BASE, str(_FRONTEND_DIR), cache_headers=False),\n                StaticPathConfig(LEGACY_BRAND_URL, str(_BRAND_DIR), cache_headers=False),\n            ]\n'''
          new_static = '''            [\n                # The package version is part of the URL path. Relative ES-module\n                # imports therefore inherit the same immutable cache namespace.\n                StaticPathConfig(versioned_url_base, str(_FRONTEND_DIR), cache_headers=True),\n                StaticPathConfig(versioned_brand_url, str(_BRAND_DIR), cache_headers=True),\n                # Unversioned aliases remain available only for compatibility.\n                StaticPathConfig(URL_BASE, str(_FRONTEND_DIR), cache_headers=False),\n                StaticPathConfig(BRAND_URL, str(_BRAND_DIR), cache_headers=False),\n                StaticPathConfig(LEGACY_URL_BASE, str(_FRONTEND_DIR), cache_headers=False),\n                StaticPathConfig(LEGACY_BRAND_URL, str(_BRAND_DIR), cache_headers=False),\n            ]\n'''
          if old_static not in init:
              raise SystemExit('Unable to locate static path block in __init__.py')
          init = init.replace(old_static, new_static)
          init = init.replace('frontend.add_extra_js_url(hass, MODULE_URL)', 'frontend.add_extra_js_url(hass, module_url)')
          init = init.replace('"module_url": MODULE_URL,', '"module_url": module_url,')
          init = init.replace('data[entry.entry_id] = {"module_url": MODULE_URL}', 'data[entry.entry_id] = {"module_url": module_url}')
          init = init.replace(
              '''    try:\n        frontend.remove_extra_js_url(hass, MODULE_URL)\n    except (KeyError, ValueError):\n        pass\n    hass.data.get(DOMAIN, {}).pop(entry.entry_id, None)\n''',
              '''    entry_data = hass.data.get(DOMAIN, {}).get(entry.entry_id, {})\n    module_url = entry_data.get("module_url")\n    if module_url:\n        try:\n            frontend.remove_extra_js_url(hass, module_url)\n        except (KeyError, ValueError):\n            pass\n    hass.data.get(DOMAIN, {}).pop(entry.entry_id, None)\n'''
          )
          init_path.write_text(init, encoding='utf-8')

          # 4. Runtime package version is inferred from the versioned module URL.
          version_module = frontend / 'lotus-version.js'
          version_module.write_text('''/* Package version derived from the versioned static URL registered by Home Assistant. */\nconst moduleUrl = new URL(import.meta.url);\nconst pathParts = moduleUrl.pathname.split("/").filter(Boolean);\nconst pathVersion = decodeURIComponent(pathParts.at(-2) || "");\nconst queryVersion = String(moduleUrl.searchParams.get("v") || "").trim();\nconst candidate = queryVersion || pathVersion;\nconst VERSION_PATTERN = /^\\d+\\.\\d+\\.\\d+[0-9A-Za-z.+-]*$/;\n\nexport const LOTUS_PACKAGE_VERSION = VERSION_PATTERN.test(candidate) ? candidate : "dev";\nexport const LOTUS_PACKAGE_IS_VERSIONED = LOTUS_PACKAGE_VERSION !== "dev";\n''', encoding='utf-8')

          # 5. Rename beta-suffixed implementation files to stable internal names.
          renames = {\n              'lotus-slide-editor-b1.js': 'lotus-slide-editor.js',\n              'lotus-slide-editor-direct-b1.js': 'lotus-slide-editor-direct.js',\n              'lotus-slide-editor-direct-fix-b1.js': 'lotus-slide-editor-direct-fix.js',\n          }
          for old, new in renames.items():
              old_path = frontend / old
              new_path = frontend / new
              if old_path.exists():
                  old_path.rename(new_path)
              elif not new_path.exists():
                  raise SystemExit(f'Missing expected module {old}')

          # 6. Remove package-version query strings from all frontend modules.
          for path in frontend.glob('*.js'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('?v=0.13.0b3', '')
              path.write_text(text, encoding='utf-8')

          # 7. Centralize diagnostic version constants on lotus-version.js.
          def replace_required(path_name, old, new):
              path = frontend / path_name
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path_name}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_required(
              'lotus-core.js',
              'import { lotusT } from "./lotus-i18n.js";\n\nexport const LOTUS_VISUAL_VERSION = "0.13.0b3";',
              'import { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\nimport { lotusT } from "./lotus-i18n.js";\n\nexport const LOTUS_VISUAL_VERSION = LOTUS_PACKAGE_VERSION;'
          )
          replace_required(
              'lotus-i18n.js',
              'import {\n  LOTUS_EXTRA_LANGUAGES,',
              'import { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\nimport {\n  LOTUS_EXTRA_LANGUAGES,'
          )
          replace_required('lotus-i18n.js', 'export const LOTUS_I18N_VERSION = "0.13.0b3";', 'export const LOTUS_I18N_VERSION = LOTUS_PACKAGE_VERSION;')

          replace_required(
              'lotus-i18n-extra.js',
              'export const LOTUS_I18N_EXTRA_VERSION = "0.13.0b3";',
              'import { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\n\nexport const LOTUS_I18N_EXTRA_VERSION = LOTUS_PACKAGE_VERSION;'
          )
          replace_required(
              'lotus-i18n-europe.js',
              '/* European language pack for Lotus View Studio 0.13.0b3. */\nexport const LOTUS_EUROPE_VERSION = "0.13.0b3";',
              '/* European language pack for Lotus View Studio. */\nimport { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\n\nexport const LOTUS_EUROPE_VERSION = LOTUS_PACKAGE_VERSION;'
          )
          replace_required(
              'lotus-iconset.js',
              'const LOTUS_ICONSET_VERSION = "0.13.0b3";',
              'import { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\n\nconst LOTUS_ICONSET_VERSION = LOTUS_PACKAGE_VERSION;'
          )

          # Bridges keep diagnostic fields, but derive them instead of hardcoding them.
          bridge_specs = [
              ('lotus-direct-create-bridge.js', 'const DIRECT_PREFIX', 'directCreateBridge: "0.13.0b3"', 'directCreateBridge: LOTUS_PACKAGE_VERSION'),
              ('lotus-icon-size-bridge.js', 'const ICON_PATCHED', 'iconSizeBridge: "0.13.0b3",\n  stackResponsiveBridge: "0.13.0b3"', 'iconSizeBridge: LOTUS_PACKAGE_VERSION,\n  stackResponsiveBridge: LOTUS_PACKAGE_VERSION'),
              ('lotus-image-fit-bridge.js', 'const PATCHED', 'imageFitBridge: "0.13.0b3"', 'imageFitBridge: LOTUS_PACKAGE_VERSION'),
          ]
          for filename, marker, old_value, new_value in bridge_specs:
              path = frontend / filename
              text = path.read_text(encoding='utf-8')
              text = text.replace('0.13.0b3', 'current package')
              if 'LOTUS_PACKAGE_VERSION' not in text:
                  text = text.replace(marker, 'import { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\n\n' + marker, 1)
              # Restore/replace diagnostic value after the comment cleanup.
              text = text.replace(old_value.replace('0.13.0b3', 'current package'), new_value)
              path.write_text(text, encoding='utf-8')

          edit_path = frontend / 'lotus-edit-dialog-bridge.js'
          edit = edit_path.read_text(encoding='utf-8').replace('0.13.0b3', 'current package')
          edit = edit.replace('import { lotusDebug, lotusSetHass, lotusT } from "./lotus-i18n.js";', 'import { LOTUS_PACKAGE_VERSION } from "./lotus-version.js";\nimport { lotusDebug, lotusSetHass, lotusT } from "./lotus-i18n.js";')
          edit = edit.replace('editDialogBridge: "current package"', 'editDialogBridge: LOTUS_PACKAGE_VERSION')
          edit_path.write_text(edit, encoding='utf-8')

          # 8. Bootstrap no longer carries a version. Its own URL is already versioned.
          visual_path = frontend / 'lotus-visual.js'
          visual = visual_path.read_text(encoding='utf-8')
          visual = re.sub(
              r'^// Bootstrap version.*?const LOTUS_VISUAL_BOOTSTRAP_VERSION = "0\.13\.0b3";\nawait import\(`\.\/lotus-iconset\.js\?v=\$\{LOTUS_VISUAL_BOOTSTRAP_VERSION\}`\);\nconst \{ LOTUS_VISUAL_VERSION \} = await import\(`\.\/lotus-core\.js\?v=\$\{LOTUS_VISUAL_BOOTSTRAP_VERSION\}`\);',
              'await import("./lotus-iconset.js");\nconst { LOTUS_VISUAL_VERSION } = await import("./lotus-core.js");',
              visual,
              flags=re.DOTALL,
          )
          # Query strings were already stripped above; convert remaining dynamic imports to plain relative imports.
          visual = re.sub(r'await import\(`(\./[^`]+)`\);', r'await import("\1");', visual)
          visual = visual.replace('lotus-slide-editor-b1.js', 'lotus-slide-editor.js')
          visual = visual.replace('lotus-slide-editor-direct-b1.js', 'lotus-slide-editor-direct.js')
          visual = visual.replace('lotus-slide-editor-direct-fix-b1.js', 'lotus-slide-editor-direct-fix.js')
          visual = visual.replace('// 0.13.0b3 keeps the stable 1.3.0 runtime and the editor UX refinements\n// introduced during the 0.13.0 beta cycle.\n', '// Load the stable Lotus Slide runtime and its visual editor refinements.\n')
          visual_path.write_text(visual, encoding='utf-8')

          # 9. Brand asset uses the same versioned URL namespace.
          manager_path = frontend / 'lotus-visual-manager.js'
          manager = manager_path.read_text(encoding='utf-8')
          manager = manager.replace(
              'const LOTUS_BRAND_ICON_URL = `/lotus_view_studio_brand/icon.png?v=${LOTUS_VISUAL_VERSION}`;',
              'const LOTUS_BRAND_ICON_URL = LOTUS_VISUAL_VERSION === "dev"\n  ? "/lotus_view_studio_brand/icon.png"\n  : `/lotus_view_studio_brand/${encodeURIComponent(LOTUS_VISUAL_VERSION)}/icon.png`;'
          )
          manager_path.write_text(manager, encoding='utf-8')

          # 10. Remove obsolete package-version references from comments in renamed modules.
          for filename in ['lotus-slide-editor.js', 'lotus-slide-editor-direct.js', 'lotus-slide-editor-direct-fix.js']:
              path = frontend / filename
              text = path.read_text(encoding='utf-8').replace('0.13.0b3', 'the current Lotus View Studio package')
              path.write_text(text, encoding='utf-8')

          # 11. Permanent architecture guard: future releases change manifest.json only.
          guard_path = root / '.github' / 'workflows' / 'version-consistency.yml'
          guard_path.write_text('''name: Validate package version architecture\n\non:\n  push:\n  pull_request:\n  workflow_dispatch:\n\npermissions: {}\n\njobs:\n  version-consistency:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v5\n      - name: Verify single package version source\n        shell: python\n        run: |\n          from pathlib import Path\n          import json\n          import re\n          import sys\n\n          component = Path("custom_components/lotus_view_studio")\n          frontend = component / "frontend"\n          manifest = json.loads((component / "manifest.json").read_text(encoding="utf-8"))\n          version = str(manifest.get("version", "")).strip()\n          errors = []\n\n          if not version:\n              errors.append("manifest.json does not declare a version")\n\n          for path in sorted(frontend.glob("*.js")):\n              text = path.read_text(encoding="utf-8")\n              if version and version in text:\n                  errors.append(f"{path}: package version {version} is hardcoded in frontend code")\n              if re.search(r"[?&]v=(?:\\d|\\$\\{)", text):\n                  errors.append(f"{path}: manual version query-string cache busting is forbidden")\n              if re.search(r"-b\\d+\\.js$", path.name):\n                  errors.append(f"{path}: beta number must not be encoded in an implementation filename")\n\n          const_text = (component / "const.py").read_text(encoding="utf-8")\n          if re.search(r"^VERSION\\s*=", const_text, flags=re.MULTILINE):\n              errors.append("const.py must not duplicate the manifest package version")\n          if re.search(r"^MODULE_URL\\s*=", const_text, flags=re.MULTILINE):\n              errors.append("const.py must not hardcode the package module URL")\n\n          if not (frontend / "lotus-version.js").exists():\n              errors.append("frontend/lotus-version.js is missing")\n\n          if errors:\n              print("Version architecture validation failed:")\n              for error in errors:\n                  print(f"- {error}")\n              sys.exit(1)\n\n          print(f"Package version source is manifest.json only: {version}")\n''', encoding='utf-8')

          # 12. Final local assertions before committing.
          errors = []
          for path in sorted(frontend.glob('*.js')):
              text = path.read_text(encoding='utf-8')
              if new_version in text:
                  errors.append(f'{path}: still hardcodes {new_version}')
              if '?v=' in text:
                  errors.append(f'{path}: still contains ?v= cache busting')
              if re.search(r'-b\d+\.js$', path.name):
                  errors.append(f'{path}: beta suffix remains in filename')
          if errors:
              raise SystemExit('Refactor validation failed:\n' + '\n'.join(errors))
          PY

          git diff --check

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use manifest as single package version source"
          git push origin HEAD:refactor/single-version-source-b4
