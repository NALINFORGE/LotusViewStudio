name: Refactor single package version source v2

on:
  push:
    branches:
      - refactor/single-version-source-b4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/single-version-source-b4

      - name: Apply single-version refactor
        run: python scripts/refactor_version_b4.py

      - name: Verify diff
        run: git diff --check

      - name: Commit component refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/lotus_view_studio
          if git diff --cached --quiet; then
            echo "No component changes to commit."
            exit 0
          fi
          git commit -m "Use manifest as single package version source"
          git push origin HEAD:refactor/single-version-source-b4
