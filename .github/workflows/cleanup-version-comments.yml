name: Cleanup version refactor comments

on:
  push:
    branches:
      - refactor/single-version-source-b4

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/single-version-source-b4

      - name: Normalize version-independent comments
        shell: python
        run: |
          from pathlib import Path

          frontend = Path("custom_components/lotus_view_studio/frontend")
          replacements = {
              "lotus-direct-create-bridge.js": {
                  "Lotus View Studio direct-create bridge — vcurrent package": "Lotus View Studio direct-create bridge",
              },
              "lotus-edit-dialog-bridge.js": {
                  "Lotus View Studio edit-dialog bridge — vcurrent package": "Lotus View Studio edit-dialog bridge",
              },
              "lotus-icon-size-bridge.js": {
                  "Lotus View Studio native picture-elements responsive bridge — vcurrent package": "Lotus View Studio native picture-elements responsive bridge",
              },
              "lotus-image-fit-bridge.js": {
                  "Lotus View Studio native picture-elements image-fit bridge — vcurrent package": "Lotus View Studio native picture-elements image-fit bridge",
              },
              "lotus-i18n-europe.js": {
                  "European language pack for Lotus View Studio current package.": "European language pack for Lotus View Studio.",
              },
              "lotus-slide-editor.js": {
                  "Lotus Slide editor UX patch for Lotus View Studio current package.": "Lotus Slide editor UX patch for Lotus View Studio.",
              },
              "lotus-slide-editor-direct.js": {
                  "Lotus Slide direct preview editor — current package.": "Lotus Slide direct preview editor.",
              },
              "lotus-slide-editor-direct-fix.js": {
                  "Refinements for the current package direct Lotus Slide preview editor.": "Refinements for the direct Lotus Slide preview editor.",
              },
          }

          changed = []
          for filename, mapping in replacements.items():
              path = frontend / filename
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in mapping.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(filename)

          if not changed:
              raise SystemExit("No comments required cleanup")
          print("Cleaned:", ", ".join(changed))

      - name: Commit comment cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/lotus_view_studio/frontend
          git diff --cached --check
          git commit -m "Clean version-independent frontend comments"
          git push origin HEAD:refactor/single-version-source-b4
