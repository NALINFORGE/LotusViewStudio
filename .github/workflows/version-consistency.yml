name: Validate package version architecture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify manifest is the single package version source
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import sys

          component = Path("custom_components/lotus_view_studio")
          frontend = component / "frontend"
          manifest = json.loads((component / "manifest.json").read_text(encoding="utf-8"))
          version = str(manifest.get("version", "")).strip()
          errors = []

          if not version:
              errors.append("manifest.json does not declare a package version")

          const_text = (component / "const.py").read_text(encoding="utf-8")
          if re.search(r"^VERSION\s*=", const_text, flags=re.MULTILINE):
              errors.append("const.py must not duplicate the package VERSION")
          if re.search(r"^MODULE_URL\s*=", const_text, flags=re.MULTILINE):
              errors.append("const.py must not duplicate a versioned MODULE_URL")

          version_module = frontend / "lotus-version.js"
          if not version_module.exists():
              errors.append("frontend/lotus-version.js is missing")

          forbidden_assignments = (
              r"LOTUS_VISUAL_BOOTSTRAP_VERSION\s*=",
              r"LOTUS_VISUAL_VERSION\s*=\s*['\"]",
              r"LOTUS_I18N_VERSION\s*=\s*['\"]",
              r"LOTUS_I18N_EXTRA_VERSION\s*=\s*['\"]",
              r"LOTUS_EUROPE_VERSION\s*=\s*['\"]",
              r"LOTUS_ICONSET_VERSION\s*=\s*['\"]",
              r"directCreateBridge\s*:\s*['\"]\d",
              r"editDialogBridge\s*:\s*['\"]\d",
              r"iconSizeBridge\s*:\s*['\"]\d",
              r"stackResponsiveBridge\s*:\s*['\"]\d",
              r"imageFitBridge\s*:\s*['\"]\d",
          )

          for path in sorted(frontend.glob("*.js")):
              text = path.read_text(encoding="utf-8")
              if version and version in text:
                  errors.append(f"{path}: current package version {version} is hardcoded")
              if re.search(r"0\.13\.0b\d+", text):
                  errors.append(f"{path}: historical package beta version is hardcoded")
              if "?v=" in text:
                  errors.append(f"{path}: manual ?v= cache busting is forbidden")
              if re.search(r"-b\d+\.js$", path.name):
                  errors.append(f"{path}: beta number is encoded in an implementation filename")
              for pattern in forbidden_assignments:
                  if re.search(pattern, text):
                      errors.append(f"{path}: package version diagnostic is hardcoded ({pattern})")

          core_text = (frontend / "lotus-core.js").read_text(encoding="utf-8")
          if "LOTUS_VISUAL_VERSION = LOTUS_PACKAGE_VERSION" not in core_text:
              errors.append("lotus-core.js must derive LOTUS_VISUAL_VERSION from LOTUS_PACKAGE_VERSION")

          init_text = (component / "__init__.py").read_text(encoding="utf-8")
          if "_MANIFEST_PATH" not in init_text or "def _package_version()" not in init_text:
              errors.append("backend must derive the package version from manifest.json")

          if errors:
              print("Version architecture validation failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print(f"Single package version source validated: manifest.json -> {version}")
